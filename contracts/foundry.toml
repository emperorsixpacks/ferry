[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
# Reproducible bytecode for the artifacts committed in crates/ferry-evm/artifacts.
bytecode_hash = "none"
cbor_metadata = false

[fuzz]
runs = 1000

[fmt]
line_length = 100

[lint]
exclude_lints = ["screaming-snake-case-const", "asm-keccak256", "unwrapped-modifier-logic"]
