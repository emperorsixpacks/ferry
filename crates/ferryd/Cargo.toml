[package]
name = "ferryd"
description = "Ferry daemon: runs one party of a ZEC<->BTC swap, with an HTTP API for the peer and the UI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ferry-core.workspace = true
ferry-dleq.workspace = true
ferry-btc = { path = "../ferry-btc", features = ["rpc"] }
anyhow = "1"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hex.workspace = true
humantime = "2"
rand_core.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
