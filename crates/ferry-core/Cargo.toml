[package]
name = "ferry-core"
description = "Ferry swap session logic: parameters, messages, key material, state machines (no I/O)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ferry-dleq.workspace = true
ferry-btc.workspace = true
# EVM counter-chain: addresses, swap ids, the EIP-712 ready digest (no RPC client).
ferry-evm = { path = "../ferry-evm", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
zeroize.workspace = true
rand_core.workspace = true
blake2b_simd = "1"

[dev-dependencies]
ferry-evm = { path = "../ferry-evm" }
ferry-btc = { path = "../ferry-btc", features = ["rpc"] }
tokio.workspace = true
reddsa = "=0.6.1"
