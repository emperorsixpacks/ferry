[package]
name = "ferry-btc"
description = "Bitcoin leg of Ferry: Taproot swap scripts, transaction templates, BIP340 adaptor signatures"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["rpc"]
# Minimal async bitcoind JSON-RPC client.
rpc = ["dep:reqwest", "dep:serde_json"]

[dependencies]
bitcoin.workspace = true
schnorr_fun.workspace = true
sha2.workspace = true
rand.workspace = true
serde.workspace = true
thiserror.workspace = true
zeroize.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
ferry-dleq.workspace = true
rand_core.workspace = true
serde_json.workspace = true
tokio.workspace = true
