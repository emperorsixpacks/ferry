[package]
name = "ferry-evm"
description = "EVM leg of Ferry: FerryLock contract client, event watching, share extraction, secp256k1 point addresses"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alloy = { version = "~2.1", default-features = false, features = [
    "std",
    "contract",
    "provider-http",
    "reqwest",
    "rpc-types",
    "signer-local",
    "sol-types",
    "network",
    "consensus",
    "eips",
] }
k256 = { version = "0.13.4", default-features = false, features = ["std", "arithmetic"] }
thiserror.workspace = true

[dev-dependencies]
alloy = { version = "~2.1", default-features = false, features = ["node-bindings"] }
ferry-dleq.workspace = true
rand_core.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true
