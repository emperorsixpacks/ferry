[package]
name = "btc-swap-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bitcoin = { version = "0.32", features = ["rand-std"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
schnorr_fun = "0.13"
serde_json = "1"
sha2 = "0.10"
